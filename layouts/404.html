{{ define "main" }}
<div style="text-align:center; padding: 6rem 1.5rem;">
  <p style="font-size:5rem; margin-bottom:1rem;">🔍</p>
  <h1 style="font-size:2.5rem; font-weight:700; margin-bottom:1rem;">{{ i18n "page_not_found_title" }}</h1>
  <p style="color:var(--text-muted); font-size:1.1rem; max-width:480px; margin:0 auto 2rem;">
    {{ i18n "page_not_found_desc" }}
  </p>
  <div style="display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap;">
    <a href="{{ .Site.Home.RelPermalink }}" class="btn btn-primary">{{ i18n "back_home" }}</a>
    <a href="{{ relLangURL "posts/" }}" class="btn btn-secondary">{{ i18n "browse_posts" }}</a>
    <a href="{{ relLangURL "contact/" }}" class="btn btn-outline">{{ i18n "btn_contact" }}</a>
  </div>
</div>
{{ end }}
