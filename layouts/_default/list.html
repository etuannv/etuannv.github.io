{{ define "main" }}
<div class="page-header">
  <h1>{{ .Title }}</h1>
  {{ with .Description }}<p>{{ . }}</p>{{ end }}
</div>
<div class="card-grid">
  {{ range .Pages.ByDate.Reverse }}
  <div class="card">
    <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>
    <h3><a href="{{ .Permalink }}">{{ .Title }}</a></h3>
    <p>{{ .Description }}</p>
    <div class="card-footer">
      <div class="tags">{{ range .Params.tags }}<span class="tag">{{ . }}</span>{{ end }}</div>
      <a class="card-link" href="{{ .Permalink }}">{{ i18n "view_more" }}</a>
    </div>
  </div>
  {{ end }}
</div>
{{ end }}
