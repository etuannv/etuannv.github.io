{{ define "main" }}
<article class="post">
  <header class="post-header">
    <h1>{{ .Title }}</h1>
    {{ if not .Date.IsZero }}<time>{{ .Date.Format "January 2, 2006" }}</time>{{ end }}
    {{ with .Params.categories }}
    <div class="categories">
      {{ range . }}<a class="category" href="/categories/{{ . | urlize }}/">{{ . }}</a>{{ end }}
    </div>
    {{ end }}
    {{ with .Params.tags }}
    <div class="tags">
      {{ range . }}<a class="tag" href="/tags/{{ . | urlize }}/">{{ . }}</a>{{ end }}
    </div>
    {{ end }}
  </header>
  <div class="post-content">
    {{ .Content }}
  </div>
</article>
{{ end }}
