baseURL: "https://etuannv.com/"
paginate: 10
enableRobotsTXT: true
buildDrafts: false

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

params:
  author: "Tuan Nguyen"
  env: production

  socialIcons:
    - name: github
      url: "https://github.com/etuannv"
    - name: twitter
      url: "https://x.com/etuannv"
    - name: email
      url: "mailto:etuannv@gmail.com"

  label:
    text: "etuannv.com"

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  profileMode:
    enabled: false

  cover:
    hidden: false
    hiddenInList: false

taxonomies:
  category: categories
  tag: tags

sitemap:
  changefreq: weekly
  priority: 0.5

languages:
  en:
    label: "English"
    locale: "en-us"
    weight: 1
    title: "etuannv.com"
    params:
      description: "AI Automation, n8n & AI Agents | RAG Chatbots | Python Data Expert — Top Rated Plus on Upwork, 100% Job Success, 10+ years experience."
      keywords: ["AI automation", "n8n", "AI agent", "RAG chatbot", "LLM integration", "web scraping", "python", "data pipeline", "workflow automation", "LangChain"]
      homeInfoParams:
        Title: "Hi, I'm Tuan Nguyen 👋"
        Content: >
          I build **AI automation** that actually ships — n8n & Make workflows, AI agents, and RAG chatbots,
          backed by 10+ years of Python automation and data engineering.
          Top Rated Plus on Upwork · 100% Job Success · 4,000+ hours delivered.
          Browse my projects below or [contact me](/contact) to discuss yours.
    menu:
      main:
        - identifier: services
          name: Services
          url: /services/
          weight: 10
        - identifier: projects
          name: Projects
          url: /projects/
          weight: 20
        - identifier: blog
          name: Blog
          url: /posts/
          weight: 30
        - identifier: contact
          name: Contact
          url: /contact/
          weight: 40

  vi:
    label: "Tiếng Việt"
