        Content: >
          Tôi xây dựng **hệ thống tự động hóa AI** thực sự vận hành được — workflow n8n & Make, AI agents và RAG chatbot,
          trên nền tảng 10+ năm tự động hóa Python và kỹ thuật dữ liệu.
          Top Rated Plus trên Upwork · 100% Job Success · 4.000+ giờ bàn giao.
          Xem các dự án của tôi dưới đây hoặc [liên hệ với tôi](/vi/contact) để trao đổi về dự án của bạn.
    menu:
