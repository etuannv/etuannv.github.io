baseURL: "https://etuannv.com/"
paginate: 10
enableRobotsTXT: true
buildDrafts: false

defaultContentLanguage: en
defaultContentLanguageInSubdir: false

params:
  author: "Tuan Nguyen"
  env: production

  socialIcons:
    - name: github
      url: "https://github.com/etuannv"
    - name: twitter
      url: "https://x.com/etuannv"
    - name: email
      url: "mailto:etuannv@gmail.com"

  label:
    text: "etuannv.com"

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false

  profileMode:
    enabled: false

  cover:
    hidden: false
    hiddenInList: false

taxonomies:
  category: categories
  tag: tags

sitemap:
  changefreq: weekly
  priority: 0.5

languages:
  en:
    label: "English"
    locale: "en-us"
    weight: 1
    title: "etuannv.com"
    params:
